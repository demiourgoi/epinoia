# CI for the epinoia repository: the root Makefile's hermetic test suites
# and the aletheia project's pytest suite, on every pull request and every
# merge to main (merges arrive as pushes to main). The live `make test-e2e`
# suites are intentionally not run here: they need opencode authentication
# and spend model tokens, so they stay a developer-side opt-in.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A run per ref (PR or branch); pushes to the same PR cancel the now-stale
# run, so fast fixup pushes do not queue full runs behind each other.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills-repo:
    name: Skills and tooling (make test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # run-review.sh requires the opencode binary on PATH even for dry
      # runs (it exits early without it), but the hermetic suites never
      # execute it: they stub their own calls to it, and the only suite that
      # runs the real binary is the live e2e suite, skipped in CI. A no-op
      # stub satisfies the PATH check without a Node install and without an
      # unpinned npm package that a bad upstream release could break.
      - name: Put an opencode stub on PATH for the hermetic suites
        run: |
          mkdir -p "$RUNNER_TEMP/stub-bin"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/stub-bin/opencode"
          chmod +x "$RUNNER_TEMP/stub-bin/opencode"
          echo "$RUNNER_TEMP/stub-bin" >> "$GITHUB_PATH"

      - name: Run the hermetic Makefile test suites
        run: make test

  aletheia:
    name: Aletheia (make -C aletheia test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aletheia
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes no floating vX major tag, so this is pinned.
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"

      - name: Install the virtual environment
        run: make install

      - name: Run the aletheia test suite
        run: make test
