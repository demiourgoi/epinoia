version = 1

# NOTE: reuse detects any "Copyright" line in file content, and in-file
# detection outranks these annotations. THIRD-PARTY-NOTICES.md quotes the
# upstream NOTICE verbatim (Apache-2.0 §4(d)) and the
# update-third-party-notices skill shows the same line in an example, so
# `reuse spdx` lists the Amazon copyright for those two files. This file is
# the authoritative record: both are original demiourgoi content under MIT.

# Original content by demiourgoi.
[[annotations]]
path = [
    ".gitignore",
    "Makefile",
    "README.md",
    "DEVELOPER_GUIDE.md",
    "THIRD-PARTY-NOTICES.md",
    "bin/agent-sop-to-skill.sh",
    ".opencode/opencode.json",
    "skills/edenai-zed-config/SKILL.md",
    "skills/ponytail-review-pdd/SKILL.md",
    "skills/ponytail-review-pdd/scripts/compute-diff.sh",
    "skills/ponytail-review-pdd/scripts/run-review.sh",
    "tests/README.md",
    "tests/run.sh",
    "tests/lib.sh",
    "tests/test-install.sh",
    "tests/skills/ponytail-review-pdd/lib.sh",
    "tests/skills/ponytail-review-pdd/test-run-review.sh",
    "tests/skills/ponytail-review-pdd/test-compute-diff.sh",
    "tests/skills/ponytail-review-pdd/test-e2e.sh",
    ".agents/skills/update-third-party-notices/SKILL.md",
]
SPDX-FileCopyrightText = "Copyright (c) 2026 demiourgoi"
SPDX-License-Identifier = "MIT"

# Modified derivative of DietrichGebert/ponytail. The human-readable
# notice lives in the LICENSE sidecar next to the agent; the annotation
# keeps the agent file free of in-file headers.
[[annotations]]
path = [
    ".opencode/agents/ponytail-review-readonly.md",
    ".opencode/agents/LICENSE",
]
SPDX-FileCopyrightText = [
    "Copyright (c) 2026 DietrichGebert",
    "Copyright (c) 2026 demiourgoi",
]
SPDX-License-Identifier = "MIT"

# Modified derivatives of strands-agents/agent-sop. Human-readable notices
# live in LICENSE sidecars next to the skills; annotations keep the SKILL.md
# files free of in-file headers.
[[annotations]]
path = [
    "skills/pdd/SKILL.md",
    "skills/pdd/LICENSE",
    "skills/codebase-summary/SKILL.md",
    "skills/codebase-summary/LICENSE",
    ".agents/skills/agent-sop-author/SKILL.md",
    ".agents/skills/agent-sop-author/LICENSE",
    ".agents/skills/agent-sop-author/validate-skill.sh",
]
SPDX-FileCopyrightText = [
    "Copyright Amazon.com, Inc. or its affiliates. All Rights Reserved.",
    "Copyright (c) 2026 demiourgoi",
]
SPDX-License-Identifier = "Apache-2.0"

# Documentation from agentskills/agentskills. The upstream repository licenses
# its code under Apache-2.0 but its documentation under CC-BY-4.0.
[[annotations]]
path = [
    ".agents/skills/agent-sop-author/assets/agent-skills-specification.md",
    ".agents/skills/agent-sop-author/assets/LICENSE",
]
SPDX-FileCopyrightText = [
    "Copyright 2025 Anthropic, PBC",
    "Copyright (c) 2026 demiourgoi",
]
SPDX-License-Identifier = "CC-BY-4.0"
