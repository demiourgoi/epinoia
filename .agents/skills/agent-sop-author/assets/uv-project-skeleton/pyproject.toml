[project]
# Skeleton uv project for agent-sop-author skills whose scripts need
# third-party dependencies (copy this file, fill in name/description,
# add the minimal dependency set). Based on the Harold harold-mcp project.
name = "skill-scripts"
version = "0.1.0.dev0"
description = "Scripts requiring third-party dependencies for <skill-name>."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Only add what the standard library truly cannot do.
dependencies = []

[project.urls]
Repository = "https://github.com/demiourgoi/epinoia"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.19.1",
    "ruff>=0.15.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_scripts"]

[tool.mypy]
files = ["src"]
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "I",   # isort
    "E", "W",  # pycodestyle
    "F",   # pyflakes
    "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["src"]
