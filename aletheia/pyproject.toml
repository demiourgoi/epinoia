[project]
name = "aletheia"
version = "0.1.0"
description = "An MCP server for Zed-style asynchronous change review for terminal coding agents."
authors = [{ name = "Juan Rodriguez", email = "juanrh@pm.me" }]
readme = "README.md"
keywords = ["mcp", "code-review", "diff", "agent"]
# Pinned to 3.14.x per the project requirements.
requires-python = ">=3.14,<3.15"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cyclopts>=4.23.0",
    "fastmcp>=4.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "starlette>=0.48.0",
    "uvicorn>=0.38.0",
]

[project.scripts]
aletheia = "aletheia_mcp.main:app"

[project.urls]
Homepage = "https://demiourgoi.github.io"
Repository = "https://github.com/demiourgoi/epinoia"
Documentation = "https://github.com/demiourgoi/epinoia/blob/main/aletheia/README.md"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "mypy>=1.19.1",
    "ruff>=0.15.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aletheia_mcp"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/aletheia_mcp/webui/dist"]

[tool.mypy]
files = ["src"]
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120
fix = true
extend-exclude = [".agents"]

[tool.ruff.lint]
select = [
    "YTT",
    "S",
    "B",
    "A",
    "C4",
    "T10",
    "SIM",
    "I",
    "C90",
    "E", "W",
    "F",
    "PGH",
    "UP",
    "RUF",
    "TRY",
]
ignore = [
    "E501",
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S310", "S603"]

[tool.ruff.format]
preview = true
